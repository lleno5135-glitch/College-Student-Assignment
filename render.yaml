services:
  - type: web
    name: college-assignment-portal
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./CollegeAssignmentPortal/Dockerfile
    dockerContext: ./CollegeAssignmentPortal
    healthCheckPath: /
    envVars:
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:10000
      - key: ConnectionStrings__DefaultConnection
        sync: false
