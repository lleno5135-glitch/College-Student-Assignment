services:
  - type: web
    name: college-assignment-portal
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: college-assignment-db
          property: connectionString

databases:
  - name: college-assignment-db
    databaseName: collegeassignmentportal
    user: portal_user
    plan: free
    region: oregon
