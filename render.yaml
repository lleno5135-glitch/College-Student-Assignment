services:
  - type: web
    name: college-assignment-portal
    runtime: docker
    plan: free
    region: singapore
    rootDir: .
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: connect-db
          property: connectionString

databases:
  - name: connect-db
    databaseName: connect_db_btof
    plan: free
    region: singapore
